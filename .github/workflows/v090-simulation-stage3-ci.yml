name: Agent City v0.9 Simulation Stage 3 smoke

on:
  push:
    branches:
      - "simulation/v0.9-habits-stage3"

concurrency:
  group: simulation-stage3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q main.py agent_city tests

      - name: Check JavaScript syntax
        run: node --check static/app.js

      - name: Run v0.4 regression smoke
        run: python tests/smoke_v040.py

      - name: Run v0.5 simulation smoke
        run: python tests/smoke_v050.py

      - name: Run v0.5 communication integrity smoke
        run: python tests/smoke_v050_communication.py

      - name: Run v0.5 UI integration smoke
        run: python tests/smoke_v050_ui.py

      - name: Run v0.6 simulation smoke
        run: python tests/smoke_v060.py

      - name: Run v0.6 communication provenance smoke
        run: python tests/smoke_v060_communication.py

      - name: Run v0.6 memory knowledge smoke
        run: python tests/smoke_v060_memory.py

      - name: Run v0.6 assembled UI integration smoke
        run: python tests/smoke_v060_ui.py


      - name: Run v0.7 simulation smoke
        run: python tests/smoke_v070.py

      - name: Run v0.7 communication reliability smoke
        run: python tests/smoke_v070_communication.py

      - name: Run v0.7 memory maintenance smoke
        run: python tests/smoke_v070_memory.py

      - name: Run v0.7 Assets/UI smoke
        run: python tests/smoke_v070_assets.py

      - name: Run v0.8 Stage 1 simulation smoke
        run: python tests/smoke_v080_stage1.py

      - name: Run v0.8 Stage 1 communication smoke
        run: python tests/smoke_v080_communication.py

      - name: Run v0.8 Stage 1 memory smoke
        run: python tests/smoke_v080_memory.py

      - name: Run v0.8 Stage 1 Assets/UI smoke
        run: python tests/smoke_v080_assets.py

      - name: Run v0.8 Stage 2 simulation smoke
        run: python tests/smoke_v080_stage2.py

      - name: Run v0.8 Stage 2 communication smoke
        run: python tests/smoke_v080_communication_stage2.py

      - name: Run v0.8 Stage 2 memory smoke
        run: python tests/smoke_v080_memory_stage2.py

      - name: Run v0.8 Stage 2 Assets/UI smoke
        run: python tests/smoke_v080_assets_stage2.py

      - name: Run v0.8.1 Assets/UI hotfix smoke
        run: python tests/smoke_v081_assets.py

      - name: Run v0.8.2 synchronized vital-meter smoke
        run: python tests/smoke_v082_vitals.py

      - name: Run v0.8.3 personality/dialogue smoke
        run: python tests/smoke_v083_personality.py

      - name: Run v0.8.4 claim-safe summary smoke
        run: python tests/smoke_v084_summary_truth.py

      - name: Run v0.8.5 daily rhythm/recharge smoke
        run: python tests/smoke_v085_daily_rhythm.py

      - name: Run v0.8.6 stranded-citizen recovery smoke
        run: python tests/smoke_v086_stranded_recovery.py

      - name: Run v0.8.7 route-token travel visualization smoke
        run: python tests/smoke_v087_route_tokens.py

      - name: Run v0.9 Stage 1 causal Memory smoke
        run: python tests/smoke_v090_memory_stage1.py

      - name: Run v0.9 Stage 1 persistent-plan Simulation smoke
        run: python tests/smoke_v090_simulation_stage1.py

      - name: Run v0.9 Stage 1 recall-bound Communication smoke
        run: python tests/smoke_v090_communication_stage1.py

      - name: Run v0.9 Stage 1 continuity Assets/UI smoke
        run: python tests/smoke_v090_assets_stage1.py

      - name: Run v0.9 Stage 2 Simulation competence/guided-practice smoke
        run: python tests/smoke_v090_simulation_stage2.py

      - name: Run v0.9 Stage 2 Memory experience/teaching smoke
        run: python tests/smoke_v090_memory_stage2.py

      - name: Run v0.9 Stage 2 Communication guided-practice smoke
        run: python tests/smoke_v090_communication_stage2.py

      - name: Run v0.9 Stage 2 Assets continuity UI smoke
        run: python tests/smoke_v090_assets_stage2.py

      - name: Run v0.9 Stage 3 Memory pattern-evidence smoke
        run: python tests/smoke_v090_memory_stage3.py

      - name: Run v0.9 Stage 3 Simulation habit-context smoke
        run: python tests/smoke_v090_simulation_stage3.py
