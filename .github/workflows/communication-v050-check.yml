name: Communication v0.5 integrity check

on:
  push:
    branches:
      - "communication/v0.5-history-integrity"

jobs:
  communication-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py agent_city tests
      - run: python tests/smoke_v040.py
      - run: python tests/smoke_v050_communication.py
