name: Communication v0.6 provenance check

on:
  push:
    branches:
      - "communication/v0.6-knowledge-provenance"

jobs:
  communication-v060:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py agent_city tests
      - run: python tests/smoke_v040.py
      - run: python tests/smoke_v050.py
      - run: python tests/smoke_v050_communication.py
      - run: python tests/smoke_v050_ui_integration.py
      - run: python tests/smoke_v060_communication.py
