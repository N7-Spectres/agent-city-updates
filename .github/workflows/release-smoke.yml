name: Agent City release smoke test

on:
  push:
    branches:
      - "release-v*"
    paths:
      - "VERSION"

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q main.py agent_city tests

      - name: Check JavaScript syntax
        run: node --check static/app.js

      - name: Run v0.4 regression smoke
        run: python tests/smoke_v040.py

      - name: Run v0.5 simulation smoke
        run: python tests/smoke_v050.py

      - name: Run v0.5 communication integrity smoke
        run: python tests/smoke_v050_communication.py

      - name: Run v0.5 UI integration smoke
        run: python tests/smoke_v050_ui.py

      - name: Run v0.6 simulation smoke
        run: python tests/smoke_v060.py

      - name: Run v0.6 communication provenance smoke
        run: python tests/smoke_v060_communication.py

      - name: Run v0.6 memory knowledge smoke
        run: python tests/smoke_v060_memory.py

      - name: Run v0.6 assembled UI integration smoke
        run: python tests/smoke_v060_ui.py


      - name: Run v0.7 simulation smoke
        run: python tests/smoke_v070.py

      - name: Run v0.7 communication reliability smoke
        run: python tests/smoke_v070_communication.py

      - name: Run v0.7 memory maintenance smoke
        run: python tests/smoke_v070_memory.py

      - name: Run v0.7 Assets/UI smoke
        run: python tests/smoke_v070_assets.py

      - name: Run v0.8 Stage 1 simulation smoke
        run: python tests/smoke_v080_stage1.py

      - name: Run v0.8 Stage 1 communication smoke
        run: python tests/smoke_v080_communication.py

      - name: Run v0.8 Stage 1 memory smoke
        run: python tests/smoke_v080_memory.py

      - name: Run v0.8 Stage 1 Assets/UI smoke
        run: python tests/smoke_v080_assets.py

      - name: Run v0.8 Stage 2 simulation smoke
        run: python tests/smoke_v080_stage2.py

      - name: Run v0.8 Stage 2 communication smoke
        run: python tests/smoke_v080_communication_stage2.py

      - name: Run v0.8 Stage 2 memory smoke
        run: python tests/smoke_v080_memory_stage2.py

      - name: Run v0.8 Stage 2 Assets/UI smoke
        run: python tests/smoke_v080_assets_stage2.py

      - name: Run v0.8.1 Assets/UI hotfix smoke
        run: python tests/smoke_v081_assets.py
