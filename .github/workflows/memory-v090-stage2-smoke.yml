name: Memory v0.9 Stage 2 smoke
on:
  push:
    branches: ["memory/v0.9-experience-stage2"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py agent_city tests
      - run: node --check static/app.js
      - run: |
          for t in             smoke_v040.py             smoke_v050.py smoke_v050_communication.py smoke_v050_ui.py             smoke_v060.py smoke_v060_communication.py smoke_v060_memory.py smoke_v060_ui.py             smoke_v070.py smoke_v070_communication.py smoke_v070_memory.py smoke_v070_assets.py             smoke_v080_stage1.py smoke_v080_communication.py smoke_v080_memory.py smoke_v080_assets.py             smoke_v080_stage2.py smoke_v080_communication_stage2.py smoke_v080_memory_stage2.py smoke_v080_assets_stage2.py             smoke_v081_assets.py smoke_v082_vitals.py smoke_v083_personality.py smoke_v084_summary_truth.py             smoke_v085_daily_rhythm.py smoke_v086_stranded_recovery.py smoke_v087_route_tokens.py             smoke_v090_memory_stage1.py smoke_v090_simulation_stage1.py smoke_v090_communication_stage1.py smoke_v090_assets_stage1.py             smoke_v090_memory_stage2.py
          do
            python "tests/$t"
          done
